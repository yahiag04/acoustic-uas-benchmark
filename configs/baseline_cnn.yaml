seed: 42
data:
  dataset_name: halitergezer/drone-audio-detection-samples
  sample_rate: 16000
  window_seconds: 2.0
  hop_seconds: 1.0
  manifest_path: data/processed/manifest.csv
  split_dir: data/splits
  artifact_dir: artifacts/baseline_cnn
features:
  n_mels: 64
  n_fft: 1024
  win_length: 400
  hop_length: 160
model:
  name: baseline_cnn
  channels: [16, 32, 64]
training:
  batch_size: 16
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  patience: 2
evaluation:
  target_recall: 0.95
robustness:
  snr_db: [20, 10, 0]
  gain_db: [-6, 6]
